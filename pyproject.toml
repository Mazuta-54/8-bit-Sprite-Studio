[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

# ==========================================================
# МЕТАДАННЫЕ ПРОЕКТА
# ==========================================================
[tool.poetry]
name = "8-bit-sprite-studio"
version = "1.0.0"
description = "Легковесный бесплатный пиксельный редактор для инди-разработчиков и студентов геймдева"
authors = ["Самохвалов Р.В. <samohvalov@example.com>"]
maintainers = ["Николаенко В.В. <nikolaenko@example.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/username/8-bit-sprite-studio"
repository = "https://github.com/username/8-bit-sprite-studio"
documentation = "https://github.com/username/8-bit-sprite-studio/blob/main/docs/report.md"
keywords = ["pixel-art", "sprite", "editor", "game-dev", "tkinter", "8-bit", "animation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Russian",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Education",
    "Topic :: Multimedia :: Graphics :: Editors",
    "Topic :: Multimedia :: Graphics :: Editors :: Raster-Based",
]
packages = [
    { include = "src" },
]

# ==========================================================
# ЗАВИСИМОСТИ
# ==========================================================
[tool.poetry.dependencies]
python = "^3.11"

# --- GUI (Tkinter входит в стандартную поставку Python, но требует системных пакетов) ---
# На Linux: sudo apt install python3-tk
# На Windows/macOS: поставляется вместе с Python

# --- Интеграция с MS SQL Server (согласно ER-диаграмме из ТЗ) ---
pyodbc = "^5.0.1"

# --- Работа с изображениями (для экспорта в PNG) ---
pillow = "^10.2.0"

# --- Загрузка переменных окружения из .env ---
python-dotenv = "^1.0.0"

# ==========================================================
# DEV-ЗАВИСИМОСТИ (тестирование, линтинг, форматирование)
# ==========================================================
[tool.poetry.group.dev.dependencies]
# --- Линтинг и форматирование (согласно ТЗ) ---
flake8 = "^7.0.0"
black = "^24.1.0"
isort = "^5.13.2"

# --- Тестирование ---
pytest = "^8.0.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"

# --- Проверка типов (опционально) ---
mypy = "^1.8.0"

# --- Pre-commit хуки ---
pre-commit = "^3.6.0"

# ==========================================================
# КОНФИГУРАЦИЯ ИНСТРУМЕНТОВ
# ==========================================================

# ----------------------------------------------------------
# BLACK — автоматическое форматирование кода (PEP 8)
# ----------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

# ----------------------------------------------------------
# ISORT — сортировка импортов (совместимость с black)
# ----------------------------------------------------------
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# ----------------------------------------------------------
# FLAKE8 — проверка на соответствие PEP 8
# ----------------------------------------------------------
[tool.flake8]
max-line-length = 100
extend-ignore = [
    "E203",  # whitespace before ':' (конфликт с black)
    "W503",  # line break before binary operator (конфликт с black)
    "E501",  # line too long (контролируется black)
]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
]
per-file-ignores = [
    "__init__.py:F401",  # неиспользуемые импорты в __init__
]
max-complexity = 10

# ----------------------------------------------------------
# PYTEST — тестирование
# ----------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
]
markers = [
    "unit: Unit-тесты (быстрые, без зависимостей)",
    "integration: Интеграционные тесты (требуют БД)",
    "ui: Тесты пользовательского интерфейса (требуют дисплей)",
    "slow: Медленные тесты",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

# ----------------------------------------------------------
# COVERAGE — покрытие кода тестами
# ----------------------------------------------------------
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/main.py",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
fail_under = 70
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# ----------------------------------------------------------
# MYPY — статическая проверка типов (опционально)
# ----------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "venv",
    ".venv",
    "build",
    "dist",
]

# ==========================================================
# POETRY — СКРИПТЫ (команды для запуска)
# ==========================================================
[tool.poetry.scripts]
sprite-studio = "src.main:main"

# ==========================================================
# POETRY — ПЛАГИНЫ
# ==========================================================
[tool.poetry.plugins."poetry.plugin"]
# (опционально, если нужны собственные плагины Poetry)

# ==========================================================
# POETRY — URL-ИСТОЧНИКИ (если нужны приватные пакеты)
# ==========================================================
